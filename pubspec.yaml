name: notes
description: "Notes"

publish_to: 'none'

version: 1.0.6+158

environment:
  sdk: ^3.10.8

#-------------------- PACKAGES --------------------#
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Utility Packages
  http: ^1.6.0
  intl: ^0.20.2
  logger: ^2.6.2
  provider: ^6.1.5+1
  sqflite: ^2.4.2+1
  path: ^1.9.1
  path_provider: ^2.1.5
  flutter_svg: ^2.2.4
  android_intent_plus: ^6.0.0
  share_plus: ^13.1.0
  url_launcher: ^6.3.2
  package_info_plus: ^10.1.0
  image_picker: ^1.2.2
  permission_handler: ^12.0.1
  photo_manager: ^3.9.0
  vector_math: ^2.2.0
  flutter_bloc: ^9.1.1
  hydrated_bloc: ^11.0.0
  equatable: ^2.0.8
  flutter_native_splash: ^2.4.7
  file_selector: ^1.1.0
  flutter_staggered_grid_view: ^0.7.0
  camera: ^0.12.0+1
  device_info_plus: ^13.1.0
  flutter_slidable: ^4.0.3

  # Icons
  cupertino_icons: ^1.0.9
  bootstrap_icons: ^1.13.1+1
  heroicons: ^0.11.0
  coolicons: ^1.0.0
  fluentui_system_icons: ^1.1.273
  flutter_lucide: ^1.4.0
  solar_icons: ^0.0.5
  flutter_phosphor_icons: ^0.0.1+6
  feather_icons: ^1.2.0
  flutter_tabler_icons: ^1.39.0
  iconsax: ^0.0.8
  iconoir_flutter: ^7.11.0
  ionicons: ^0.2.2

  # State Management
  get: ^4.7.3
  get_storage: ^2.1.1
  #-------------------- ./ PACKAGES END --------------------#

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Utility Packages
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  intl_translation: ^0.21.0
  intl_utils: ^2.8.14
  build_runner: ^2.15.0
  build_config: ^1.3.0
  build_version: ^2.1.3

flutter_intl:
  enabled: true
  arb_dir: lib/localization/l10n
  output_dir: lib/generated/l10n

flutter:
  uses-material-design: true
  generate: true

  #-------------------- LOCAL ASSETS --------------------#
  assets:
    - assets/fonts/
    - assets/images/
    - assets/images/logos/
    - assets/images/backgrounds/
    - assets/sounds/
    - assets/vectors/

  #-------------------- LOCAL FONTS --------------------#
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins/Poppins-Light.ttf
          weight: 300
        - asset: assets/fonts/Poppins/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/Poppins/Poppins-Italic.ttf
          style: italic
        - asset: assets/fonts/Poppins/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins/Poppins-MediumItalic.ttf
          weight: 500
          style: italic
        - asset: assets/fonts/Poppins/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins/Poppins-Bold.ttf
          weight: 800
    - family: Helvetica
      fonts:
        - asset: assets/fonts/Helvetica/Helvetica-Light.otf
          weight: 300
        - asset: assets/fonts/Helvetica/Helvetica-Regular.otf
          weight: 400
          style: italic
        - asset: assets/fonts/Helvetica/Helvetica-Italic.otf
          weight: 500
        - asset: assets/fonts/Helvetica/Helvetica-Bold.otf
          weight: 800
    - family: Satoshi
      fonts:
        - asset: assets/fonts/Satoshi/Satoshi-Light.ttf
          weight: 300
        - asset: assets/fonts/Satoshi/Satoshi-Regular.ttf
          weight: 400
          style: italic
        - asset: assets/fonts/Satoshi/Satoshi-Medium.ttf
          weight: 500
        - asset: assets/fonts/Satoshi/Satoshi-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Satoshi/Satoshi-Bold.ttf
          weight: 800
    - family: Coolvetica
      fonts:
        - asset: assets/fonts/Coolvetica/Coolvetica-Italic.otf
          style: italic
        - asset: assets/fonts/Coolvetica/Coolvetica-Regular.otf
          weight: 400

flutter_icons:
  android: true
  ios: true
  image_path: assets/images/logos/notes-logo.png
